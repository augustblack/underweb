[package]
name = "demo-08-draw"
version = "0.1.0"
kind = "rust"
description = "demos/08draw_cb, ported to Rust: a shape plus animated raw cairo drawing inside it."

# filled in by `cargo xtask examples`
[targets.aarch64-apple-darwin]
