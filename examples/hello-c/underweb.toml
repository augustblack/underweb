[package]
name = "hello-c"
version = "0.1.0"
kind = "c"
description = "A C package built against include/underweb.h."

# built by `cargo xtask examples`
[targets.aarch64-apple-darwin]
file = "dist/aarch64-apple-darwin/libhello_c.dylib"

[targets.x86_64-apple-darwin]
file = "dist/x86_64-apple-darwin/libhello_c.dylib"

[targets.x86_64-unknown-linux-gnu]
file = "dist/x86_64-unknown-linux-gnu/libhello_c.so"

[targets.aarch64-unknown-linux-gnu]
file = "dist/aarch64-unknown-linux-gnu/libhello_c.so"

# for machines with no prebuilt library: the browser compiles this itself
[build]
sources = ["hello_c.c"]
