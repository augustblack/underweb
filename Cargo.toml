[workspace]
resolver = "3"
members = [
    "crates/*",
    "apps/underweb-app",
    "xtask",
    "examples/hello-rust",
    "examples/probe-rust",
    "examples/probe-net-rust",
    "examples/probe-audio-rust",
    "examples/probe-video-rust",
    "examples/demo-08-draw",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/augustblack/underweb-rs"

[workspace.dependencies]
underweb-abi = { path = "crates/underweb-abi" }
underweb-ipc = { path = "crates/underweb-ipc" }
underweb-sandbox = { path = "crates/underweb-sandbox" }
underweb-guest = { path = "crates/underweb-guest" }
underweb-pkg = { path = "crates/underweb-pkg" }
underweb-core = { path = "crates/underweb-core" }
underweb-capi = { path = "crates/underweb-capi" }
underweb-audio = { path = "crates/underweb-audio" }
underweb-media = { path = "crates/underweb-media" }
underweb-export = { path = "crates/underweb-export" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
toml = "1"
nix = { version = "0.31", features = ["socket", "uio", "mman", "fs", "poll"] }
libc = "0.2"
windows-sys = "0.61"
cairo-rs = { version = "0.21", features = ["png"] }
pango = "0.21"
pangocairo = "0.21"

[profile.dev]
# keep target/ small: V8, swc and wgpu are big
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# these move pixels and samples around; unoptimised they can't keep up
# with video even in development builds
[profile.dev.package.underweb-core]
opt-level = 2
[profile.dev.package.underweb-guest]
opt-level = 2
[profile.dev.package.underweb-ipc]
opt-level = 2
[profile.dev.package.underweb-audio]
opt-level = 2
[profile.dev.package.underweb-media]
opt-level = 2
[profile.dev.package.underweb-app]
opt-level = 2

# release archives (`cargo xtask dist`)
[profile.dist-release]
inherits = "release"
strip = "debuginfo"
