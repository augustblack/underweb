[package]
name = "underweb-audio"
description = "Audio for Underweb: the shared-memory ring, oscillators, Pure Data, and the host mixer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# the package side: oscillators and Pure Data (libpd)
engine = ["dep:libpd-sys"]
# the host side: the sound card
device = ["dep:cpal"]

[dependencies]
anyhow.workspace = true
underweb-ipc.workspace = true
libpd-sys = { version = "0.3", optional = true }
cpal = { version = "0.16", optional = true }
