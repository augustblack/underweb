[package]
name = "underweb-core"
description = "The Underweb engine as a library: runs packages in sandboxed runner processes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
underweb-ipc.workspace = true
underweb-sandbox.workspace = true
underweb-pkg.workspace = true
underweb-abi.workspace = true
underweb-audio = { workspace = true, features = ["device"] }
ureq = "3"
serde_json = "1"
base64 = "0.22"
underweb-trust = { path = "../underweb-trust" }
underweb-trust-atproto = { path = "../underweb-trust-atproto" }
url = "2"

[dev-dependencies]
underweb-audio.workspace = true
cairo-rs.workspace = true
tiny_http = "0.12"
tempfile = "3"
