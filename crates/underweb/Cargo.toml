[package]
name = "underweb"
description = "SDK for writing Underweb packages in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["cairo"]
# raw cairo drawing in Page::draw
cairo = ["dep:cairo-rs"]

[dependencies]
underweb-abi.workspace = true
cairo-rs = { workspace = true, optional = true }
