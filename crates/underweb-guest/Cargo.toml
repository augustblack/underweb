[package]
name = "underweb-guest"
description = "The curated Underweb page API (layouts, shapes, text) and its cairo/pango renderer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cairo-rs.workspace = true
pango.workspace = true
pangocairo.workspace = true
underweb-ipc.workspace = true
underweb-abi.workspace = true
# images from the package (decoded inside the sandbox)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
