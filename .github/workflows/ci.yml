name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/native-deps

      - name: Header is up to date
        shell: bash
        run: |
          cargo xtask header
          git diff --exit-code include/underweb.h

      - name: Build and test (includes the sandbox tests)
        run: cargo xtask test

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
