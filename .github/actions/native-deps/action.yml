name: Native libraries
description: cairo, pango and GStreamer for this runner, plus the C compiler setup

runs:
  using: composite
  steps:
    - name: macOS
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cairo pango pkgconf cmake gstreamer

    - name: Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev \
          libxkbcommon-dev libwayland-dev libx11-dev fonts-dejavu-core \
          libasound2-dev cmake clang libclang-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

    # cl.exe, link.exe and the Windows SDK on PATH (C packages, tests)
    - name: Windows compiler
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # GStreamer's MSVC installer carries its own glib, cairo and pango;
    # using those for everything keeps a single glib in each process.
    # Since 1.26 it is one Inno Setup .exe (runtime + development files).
    - name: Windows GStreamer (with cairo and pango)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $v = "1.28.8"
        $f = "gstreamer-1.0-msvc-x86_64-$v.exe"
        $dir = "C:\gstreamer"
        Invoke-WebRequest "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc/$f" -OutFile "$env:RUNNER_TEMP\$f"
        $p = Start-Process "$env:RUNNER_TEMP\$f" -Wait -PassThru -ArgumentList `
          "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/TYPE=full", "/DIR=$dir", "/LOG=$env:RUNNER_TEMP\gst-install.log"
        if ($p.ExitCode -ne 0) {
          Get-Content "$env:RUNNER_TEMP\gst-install.log" -Tail 40
          throw "installing $f failed ($($p.ExitCode))"
        }
        # wherever the layout puts it: the bin with gstreamer-1.0-0.dll
        $dll = Get-ChildItem $dir -Recurse -Filter gstreamer-1.0-0.dll | Select-Object -First 1
        if (-not $dll) {
          Get-ChildItem $dir -Recurse -Depth 3 | Select-Object -First 60 FullName
          throw "no gstreamer-1.0-0.dll under $dir"
        }
        $root = $dll.Directory.Parent.FullName
        Write-Output "GStreamer in $root"
        foreach ($need in "bin\cairo-2.dll", "lib\pkgconfig\gstreamer-1.0.pc", "lib\pkgconfig\pangocairo.pc") {
          if (-not (Test-Path "$root\$need")) {
            Get-ChildItem "$root\lib\pkgconfig" -ErrorAction SilentlyContinue | Select-Object -First 80 Name
            throw "this GStreamer install has no $need"
          }
        }
        "$root\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

    - name: Windows pkg-config
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install pkgconfiglite --no-progress -y
